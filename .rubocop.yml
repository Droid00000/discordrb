plugins:
  - rubocop-performance
  - rubocop-rake

inherit_mode:
  merge:
    - AllowedNames

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3

# Disable line length checks
Layout/LineLength:
  Enabled: false

# TODO: Larger refactor
Lint/MissingSuper:
  Enabled: false

# Disable all metrics.
Metrics:
  Enabled: false

# Ignore `eval` in the examples folder
Security/Eval:
  Exclude:
    - examples/**/*

# https://stackoverflow.com/q/4763121/
Style/Alias:
  Enabled: false

# Had to disable this globally because it's being silently autocorrected even with local disable comments?
Style/BisectedAttrAccessor:
  Enabled: false

# Prefer compact module/class defs
Style/ClassAndModuleChildren:
  Enabled: false

# So RuboCop doesn't complain about application IDs
Style/NumericLiterals:
  Exclude:
    - examples/**/*

# TODO: Requires breaking changes
Style/OptionalBooleanParameter:
  Enabled: false

# Prefer explicit arguments in case global variables like `$;` or `$,` are changed
Style/RedundantArgument:
  Enabled: false

###################################
## NEW COPS TO MAKE DECISIONS ON ##
###################################

# TODO: Decide how you want to handle this:
# https://rubydoc.info/gems/rubocop/RuboCop/Cop/Style/HashSyntax
Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/ArgumentsForwarding:
  Enabled: false

Style/ComparableClamp:
  Enabled: false

Style/SuperArguments:
  Enabled: false

Naming/BlockForwarding:
  Enabled: false

Style/RedundantSelfAssignmentBranch:
  Enabled: false

Gemspec/RequiredRubyVersion:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Style/RedundantParentheses:
  Enabled: false

Layout/EndOfLine:
  Enabled: true
  EnforcedStyle: lf

# This will probably be a breaking change, but should happen
Style/ReturnNilInPredicateMethodDefinition:
  Enabled: false

Style/Documentation:
  Enabled: true

Style/IfUnlessModifier:
  Enabled: false

# This is a pain to debug, because local variables that are
# also methods names take precedence (since handle_dispatch)
# is a singular method this means that variables even for un-related
# branches would set a value to `nil`. 
Style/RedundantSelf:
  Enabled: false

Style/NumericPredicate:
  Exclude:
    - lib/discordrb/data/role.rb

Style/SafeNavigationChainLength:
  Enabled: false

Naming/MethodName:
  Exclude:
    - lib/discordrb.rb